---
# deploy-site.yml — intention `deploy` : appliquer l'état désiré du registre à
# l'instance de l'hôte sélectionné, en composant `sepp67.grav_site` (lot L4).
# Une seule intention (GSO-REQ-081) ; jamais globale (GSO-REQ-082).
#
# Le chemin (sélecteur -> verrou -> assertions -> second préflight structurel
# -> traduction -> rôle) : scripts/lib/site-mutation.sh + _shared/mutate.yml.

- name: "Déployer / actualiser un site Grav"
  hosts: grav_servers
  gather_facts: false
  become: false                 # privilèges minimaux ; le rôle escalade au besoin (GSO-REQ-097)
  any_errors_fatal: true        # une cible ambiguë tue le play avant toute invocation du rôle
  vars:
    _gso_intent: deploy          # fixé par le point d'entrée, jamais par l'opérateur

  tasks:
    - name: "Séquence de mutation (assertions -> préflight -> traduction -> rôle)"
      ansible.builtin.include_tasks: _shared/mutate.yml
