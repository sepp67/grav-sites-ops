---
name: ci

# La CI n'ouvre jamais le vault réel, ne contacte aucune VM et fonctionne
# sans `inventories/production/` (GSO-REQ-030, GSO-REQ-046, GSO-REQ-058,
# GSO-REQ-139). GSO-T15 crée un conteneur grav-runtime ÉPHÉMÈRE sur le
# runner, ciblant uniquement localhost, avec des données synthétiques, puis
# le détruit. Jobs bloquants.

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Lint et garde-fous statiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install "ansible-core>=2.17" ansible-lint yamllint
      - name: GSO-T01 — syntaxe YAML / Ansible / inventaires
        run: bash tests/gso-t01-syntax.sh
      - name: GSO-T02 — ansible-lint
        run: bash tests/gso-t02-ansible-lint.sh
      - name: GSO-T04 — référence du rôle épinglée
        run: bash tests/gso-t04-role-pinned.sh
      - name: GSO-T05 — inventaire d'exemple parsable
        run: bash tests/gso-t05-example-inventory.sh
      - name: GSO-T06 — registre chargé automatiquement
        run: bash tests/gso-t06-registry-autoload.sh
      - name: GSO-T07 — correspondance hôte–registre–vault d'exemple
        run: bash tests/gso-t07-vault-example.sh
      - name: GSO-T08 — refus sans inventaire imposé
        run: bash tests/gso-t08-selector-fixed-inventory.sh
      - name: GSO-T09 — refus sans SITE
        run: bash tests/gso-t09-selector-requires-site.sh
      - name: GSO-T10 — refus global / multiple / shell
        run: bash tests/gso-t10-selector-refuses-global-and-multiple.sh
      - name: GSO-T11 — sélecteur fermé (cible inconnue/vide → code non nul)
        run: bash tests/gso-t11-selector-closed.sh
      - name: GSO-T12 — aucun contact distant après refus
        run: bash tests/gso-t12-selector-no-remote-contact.sh
      - name: GSO-T23 — aucune dépendance au control-repository
        run: bash tests/gso-t23-no-control-repository.sh
      - name: GSO-T24 — aucun chemin local ni secret suivi
        run: bash tests/gso-t24-no-local-paths-secrets.sh

  role:
    name: Installation de la dépendance de rôle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ansible-core
        run: pip install "ansible-core>=2.17"
      - name: GSO-T03 — installation depuis requirements.yml
        run: bash tests/gso-t03-role-install.sh

  translate:
    name: Traduction et isolation (doublure, sans conteneur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils + dépendances Ansible
        run: |
          pip install "ansible-core>=2.17"
          ansible-galaxy install -r requirements.yml
      - name: GSO-T13 — traduction registre + grav_secrets → grav_*
        run: bash tests/gso-t13-translate.sh
      - name: GSO-T14 — isolation des secrets et cohérence (GSO-REQ-204)
        run: bash tests/gso-t14-secret-isolation.sh
      - name: GSO-T16 — deux sites, isolation sans conteneur
        run: bash tests/gso-t16-two-sites-isolation.sh
      - name: L4 — verrou de concurrence
        run: bash tests/l4-concurrency-lock.sh

  deploy-functional:
    name: GSO-T15 — déploiement fonctionnel (conteneur éphémère)
    runs-on: ubuntu-latest    # les runners GitHub fournissent Docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils + dépendances Ansible
        run: |
          pip install "ansible-core>=2.17"
          ansible-galaxy install -r requirements.yml
      - name: Pré-tirer l'image de test (référence épinglée par digest)
        run: docker pull ghcr.io/sepp67/grav-runtime:1.0.4
      - name: GSO-T15 — déploiement réel d'un site + conteneur éphémère
        run: bash tests/gso-t15-real-deploy.sh
