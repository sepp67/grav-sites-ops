---
name: ci

# La CI n'ouvre jamais le vault réel, ne contacte aucune VM, ne tire aucune
# image et fonctionne sans `inventories/production/` (GSO-REQ-030, 046, 058,
# 108, 139). Elle n'exécute QUE des tests entièrement reproductibles avec
# des doublures. Le test fonctionnel GSO-T15 (conteneur réel) est un test
# d'acceptation LOCAL — voir docs/TESTING.md. Jobs bloquants.

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Lint et garde-fous statiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L8 : la preuve append-only inter-version parcourt l'historique Git
          # de registry/reactivated-sites.yml — un clone superficiel la ferait
          # échouer explicitement (jamais un faux succès).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install "ansible-core>=2.17" ansible-lint yamllint
      - name: GSO-T01 — syntaxe YAML / Ansible / inventaires
        run: bash tests/gso-t01-syntax.sh
      - name: GSO-T02 — ansible-lint
        run: bash tests/gso-t02-ansible-lint.sh
      - name: GSO-T04 — référence du rôle épinglée
        run: bash tests/gso-t04-role-pinned.sh
      - name: GSO-T05 — inventaire d'exemple parsable
        run: bash tests/gso-t05-example-inventory.sh
      - name: GSO-T06 — registre chargé automatiquement
        run: bash tests/gso-t06-registry-autoload.sh
      - name: GSO-T07 — correspondance hôte–registre–vault d'exemple
        run: bash tests/gso-t07-vault-example.sh
      - name: GSO-T08 — refus sans inventaire imposé
        run: bash tests/gso-t08-selector-fixed-inventory.sh
      - name: GSO-T09 — refus sans SITE
        run: bash tests/gso-t09-selector-requires-site.sh
      - name: GSO-T10 — refus global / multiple / shell
        run: bash tests/gso-t10-selector-refuses-global-and-multiple.sh
      - name: GSO-T11 — sélecteur fermé (cible inconnue/vide → code non nul)
        run: bash tests/gso-t11-selector-closed.sh
      - name: GSO-T12 — aucun contact distant après refus
        run: bash tests/gso-t12-selector-no-remote-contact.sh
      - name: GSO-T23 — aucune dépendance au control-repository
        run: bash tests/gso-t23-no-control-repository.sh
      - name: GSO-T24 — aucun chemin local ni secret suivi
        run: bash tests/gso-t24-no-local-paths-secrets.sh
      - name: L7 — garde de persistance (opérations destructives interdites — GSO-REQ-102)
        run: bash tests/l7-persistence-guard.sh
      - name: GSO-T21 — retrait déclaré sans tâche destructive
        run: bash tests/gso-t21-retrait-non-destructif.sh
      - name: GSO-T22 — registres actif / retiré disjoints, y compris après réactivation
        run: bash tests/gso-t22-disjonction-registres.sh
      - name: L8 — append-only inter-version de reactivated-sites.yml (historique Git)
        run: bash tests/l8-history-append-only.sh
      - name: L8 — validation des registres retiré / réactivé suivis + append-only
        run: make lint-lifecycle
      - name: L9 — garde-fou de la migration documentaire
        run: bash tests/l9-migration-doc-guard.sh

  role:
    name: Installation de la dépendance de rôle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ansible-core
        run: pip install "ansible-core>=2.17"
      - name: GSO-T03 — installation depuis requirements.yml
        run: bash tests/gso-t03-role-install.sh

  translate:
    name: Traduction, actions, mise à jour/rollback, isolation et verrou (doublures — 100 % reproductible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils + dépendances Ansible
        run: |
          pip install "ansible-core>=2.17"
          ansible-galaxy install -r requirements.yml
      - name: GSO-T13 — traduction registre + grav_secrets → grav_*
        run: bash tests/gso-t13-translate.sh
      - name: GSO-T14 — isolation des secrets et cohérence (GSO-REQ-204)
        run: bash tests/gso-t14-secret-isolation.sh
      - name: GSO-T16 — deux sites, isolation sans conteneur
        run: bash tests/gso-t16-two-sites-isolation.sh
      - name: L4 — verrou de concurrence
        run: bash tests/l4-concurrency-lock.sh
      - name: L5 — restart / stop (doublure)
        run: bash tests/l5-restart-stop.sh
      - name: L5 — intentions fermées (statique)
        run: bash tests/l5-action-closed.sh
      - name: GSO-T17 — mise à jour A→B (déclarative), chemins persistants conservés
        run: bash tests/gso-t17-update-a-to-b.sh
      - name: GSO-T18 — rollback B→A explicitement déclaré, chemins persistants conservés
        run: bash tests/gso-t18-rollback-b-to-a.sh

  drift:
    name: Contrôle de dérive — lecture seule (fausse CLI docker — 100 % reproductible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils + dépendances Ansible
        run: |
          pip install "ansible-core>=2.17"
          ansible-galaxy install -r requirements.yml
      - name: GSO-T19 — contrôle des trois états et classification de dérive
        run: bash tests/gso-t19-drift-classification.sh
      - name: GSO-T20 — check-all non mutant, sans invocation du rôle
        run: bash tests/gso-t20-check-all-non-mutating.sh

  # GSO-T15 (déploiement fonctionnel avec conteneur réel) n'est PAS exécuté ici :
  # il exige une image grav-runtime déjà présente localement (aucun pull
  # implicite, aucun identifiant GHCR — GSO-REQ-108). C'est un test
  # d'acceptation LOCAL : `make test-functional` (voir docs/TESTING.md).
  functional-contract:
    name: Contrat d'exécution de GSO-T15 (garde-fou statique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: L4 — le workflow ne tire ni ne référence GSO-T15
        run: bash tests/l4-ci-functional-contract.sh
