# grav-sites-ops — configuration Ansible
#
# Aucun inventaire par defaut n'est defini ici. Toute commande operationnelle
# DOIT fournir explicitement -i (ou passer par une cible Makefile qui l'ajoute
# de maniere visible). Voir le contrat architectural v0.5.0, section 8.2,
# GSO-REQ-053.
#
# Ce fichier fait partie du lot L0 (harnais). Les reglages lies aux playbooks,
# aux connexions et au vault seront ajoutes par les lots ulterieurs, sans
# jamais introduire d'inventaire de production par defaut.

[defaults]
# Le role externe est installe localement dans ./roles (ignore par Git).
roles_path = ./roles
collections_path = ./collections
retry_files_enabled = False
nocows = True
interpreter_python = auto_silent
display_skipped_hosts = False
localhost_warning = False

[inventory]
# Un inventaire absent ou mal forme doit echouer, jamais etre ignore
# silencieusement (coherent avec GSO-REQ-045 / GSO-REQ-053).
unparsed_is_failed = True
