---
# grav-sites-ops — dependances Ansible
#
# Ce fichier est l'UNIQUE source de verite de la version de
# `ansible-role-grav-site` consommee par grav-sites-ops (GSO-REQ-153).
#
# La reference DOIT rester epinglee sur un tag explicite. Une branche
# flottante, `main`, `HEAD` ou une reference vide sont interdits en
# exploitation (GSO-REQ-014, GSO-REQ-103).
#
# Installation :
#   ansible-galaxy role install -r requirements.yml -p roles
# ou :
#   make install-role

roles:
  - name: sepp67.grav_site
    src: git+https://github.com/sepp67/ansible-role-grav-site.git
    version: "v2.0.1"

# Collection requise par sepp67.grav_site v2.0.1 (voir le requirements.yml du
# rôle). Bornée à l'identique ; pas de branche flottante (GSO-REQ-041,
# GSO-REQ-103). Installée par `ansible-galaxy install -r requirements.yml`
# ou `make install-role`.
collections:
  - name: community.docker
    version: ">=5.0.0,<6.0.0"
